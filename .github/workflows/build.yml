name: build-kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            device-tree-compiler gcc-9 cpio
      - name: toolchains
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 $HOME/gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 $HOME/gcc32
      - name: build
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=$HOME/gcc64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$HOME/gcc32/bin/arm-linux-androideabi-
          make O=out HOSTCC=gcc-9 CC="$HOME/gcc64/bin/aarch64-linux-android-gcc" jason_q787_defconfig
          make O=out HOSTCC=gcc-9 CC="$HOME/gcc64/bin/aarch64-linux-android-gcc" olddefconfig
          make O=out HOSTCC=gcc-9 CC="$HOME/gcc64/bin/aarch64-linux-android-gcc" -j$(nproc)
          grep -m1 -a "Linux version" out/include/generated/utsrelease.h || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel
          path: |
            build.log
            out/.config
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/qcom/*8937*.dtb
